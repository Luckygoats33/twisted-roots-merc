<!DOCTYPE html><html><head><meta charset="utf-8"><title>m</title>
<style>html,body{margin:0;background:#222}iframe{border:0;display:block}</style></head>
<body><iframe id="f" width="390" height="844" src="index.html"></iframe>
<script>
window.probe = async function(page, w){
  const f=document.getElementById('f');
  f.width=w; f.style.width=w+'px';
  await new Promise(r=>{ f.onload=r; f.src=page+'?t='+Math.random(); });
  await new Promise(r=>setTimeout(r,2600));
  const d=f.contentDocument, win=f.contentWindow, vw=win.innerWidth;
  const clipped=(e)=>{let p=e.parentElement;while(p&&p!==d.body){if(getComputedStyle(p).overflowX!=='visible')return true;p=p.parentElement;}return false;};
  const over=[...d.querySelectorAll('body *')].filter(e=>{const r=e.getBoundingClientRect();return r.width>0&&!clipped(e)&&r.right>vw+2;})
      .map(e=>e.tagName+'.'+String(e.className).slice(0,26)+'@'+Math.round(e.getBoundingClientRect().right));
  const small=[...d.querySelectorAll('a,button,input,select,textarea')].filter(e=>{const r=e.getBoundingClientRect();return r.width>0&&(r.height<44||r.width<44);})
      .map(e=>(e.className?e.tagName+'.'+String(e.className).slice(0,22):e.tagName+':'+(e.textContent||'').trim().slice(0,14))+' '+Math.round(e.getBoundingClientRect().width)+'x'+Math.round(e.getBoundingClientRect().height));
  const tiny=[...d.querySelectorAll('p,li,td,span')].filter(e=>parseFloat(getComputedStyle(e).fontSize)<13&&(e.textContent||'').trim().length>12).length;
  const inputs=[...d.querySelectorAll('input,select,textarea')].filter(e=>parseFloat(getComputedStyle(e).fontSize)<16).length;
  return {page,vw,scrollW:d.documentElement.scrollWidth,over:[...new Set(over)].slice(0,6),overN:over.length,
          small:[...new Set(small)].slice(0,8),smallN:small.length,tinyText:tiny,zoomInputs:inputs,
          docH:d.body.scrollHeight};
};
</script></body></html>
