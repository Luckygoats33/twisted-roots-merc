<!--
============================================================
  TWISTED ROOTS MERC — JSON-LD SNIPPETS
  ------------------------------------------------------------
  Every block below is ready to paste. Copy the whole
  application/ld+json script element — opening tag, JSON, closing
  tag — into the head of the file named in the heading above it,
  just before the closing head tag.

  Rules for whoever does the pasting:
   1. One page = one set of blocks. Do not paste bakery menu
      markup onto the yard page, etc.
   2. Anything in the markup has to also be visible on the page.
      If a price changes on the page, change it here too.
   3. The homepage block carries the @id
      https://twistedrootsmerc.com/#store — every other page
      points back at that same @id instead of repeating the
      whole business record. Keep that id spelled exactly the
      same everywhere or Google reads it as two businesses.
   4. Phone number is the placeholder (541) 555-0134. Swap it
      everywhere before this goes live — search for 5550134.
   5. hq.html gets no markup at all. It is not for search.
   6. index.html ALREADY has a JSON-LD block in its head, typed
      GeneralContractor/Store/Bakery. Block A below REPLACES it —
      delete the old one. Two business records on one page is
      how you end up with two listings and neither one right.
      (The old block also types the store as a GeneralContractor,
      which would put it in search results for people looking to
      hire a builder.)

  This file lives under /seo/ and is disallowed in robots.txt.
  It is a reference sheet, not a page.
============================================================
-->
